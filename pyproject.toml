[project]
name = "korean-course-agent"
version = "1.0.0"
description = "Korean course competitive research and synthetic sales analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents==0.5.7",
    "fastapi>=0.115,<1",
    "langchain==1.2.17",
    "langchain-core>=1,<2",
    "langchain-openai==1.2.1",
    "langgraph==1.1.10",
    "pydantic>=2,<3",
    "python-dotenv==1.2.2",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.27,<1",
    "pymysql>=1.1,<2",
    "sqlglot>=30.32,<31",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "reportlab>=4,<6",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.30,<1",
]

[tool.uv]
package = false

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
