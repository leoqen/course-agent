services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ADMIN_PASSWORD:-demo-admin-change-me}
      TZ: Asia/Shanghai
    ports:
      - '127.0.0.1:3307:3306'
    command: ['--default-time-zone=+08:00','--character-set-server=utf8mb4']
    volumes:
      - korean_sales:/var/lib/mysql
      - ./docker/sales-init.sql:/docker-entrypoint-initdb.d/01-sales.sql:ro
volumes:
  korean_sales:
